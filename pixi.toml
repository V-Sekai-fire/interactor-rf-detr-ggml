# The python tooling's environment, declared, because until now it had none.
#
# This repository is C++ first -- CMakeLists.txt, src/, tests/ -- and its python lives in
# scripts/ and gen_reference/. Neither had a manifest, a lock, or any file naming what they
# import. `gate_onnx_device.py` needs numpy, onnx, onnxruntime, torch and rfdetr; nothing
# recorded that, so the gate that answers "will this deploy to the accelerator" could not be
# run from a described environment on any desk.
#
# That is the failure CLAUDE.md blocklists `uv` for, arriving without `uv`: work resting on
# an environment nobody can rebuild. The Hailo compatibility question is exactly the kind
# that must be answerable twice, by two people, and get the same answer.
[workspace]
name = "rf-detr-cpp"
version = "0.1.0"
description = "RF-DETR inference port, and the gates that decide what reaches the accelerator"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

# CPU TORCH ON PURPOSE. `gate_onnx_device.py`'s own docstring says it "needs no accelerator
# and no Dataflow Compiler" -- it exports, runs onnxruntime, and checks the operator set. A
# CUDA build would add gigabytes and change no answer.
[feature.gate.dependencies]
python = "3.11.*"

[feature.gate.pypi-dependencies]
numpy = ">=1.26"
onnx = "*"
# `hailo_ops.usda` is openusd because CLAUDE.md says data is, and reading it needs the same
# pinned validator the logbook's USD hook uses -- a layer that opens is not a layer that is
# valid, and only one of those is worth depending on.
usd-core = "==26.8"
onnxruntime = "*"
torch = { version = ">=2.6", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cpu" }
rfdetr = "*"
# The corpus is zstd parquet with image bytes in-row, so anything that reads a frame from it
# needs pyarrow. Declared here rather than discovered as a ModuleNotFoundError, which is the
# failure the `uv` blocklist entry exists to prevent.
pyarrow = ">=15"
pillow = ">=10"
# torch.onnx's dynamo path needs this and the TorchScript path does not. Declared because
# `view_as_complex` blocks the TorchScript exporter, and whether dynamo clears it is a
# question the gate should be able to ask.
onnxscript = "*"

[feature.gate.tasks]
# Does the device half export, run, and stay inside the operator set the compiler takes?
# Answers on any desk. `gate_dfc_parse.py` runs the real DFC on Linux and must agree; the
# pair's DISAGREEMENT is the finding, which is why this one is not sufficient alone.
device-gate = "python scripts/gate_onnx_device.py"
# The configuration the compiler actually accepts. The checkpoint default is 2 windows,
# which exports the 868-node graph DFC 5.3.0 rejects; 1 window exports 825 and clears
# DEVICE_OPS entirely, at a measured 1.35x wall-clock for losing windowing.
device-gate-nw1 = "python scripts/gate_onnx_device.py --num-windows 1"
# End to end: licence-clean corpus frames in, annotated frames out. Re-asserts the holdout
# exclusion before drawing anything a human looks at.
keypoints-on-corpus = "python scripts/run_keypoints_on_corpus.py"
test-device-gate = "python scripts/gate_onnx_device.py --self-test"
# The `uv` row in CLAUDE.md had no automation anywhere; this is it.
no-uv = "python scripts/check_no_uv.py"
test-no-uv = "python scripts/check_no_uv.py --self-test"
# ONNX is blocklisted as a format; the device gate's scratch export is exempt only
# while it stays out of the tree. This holds that boundary.
no-committed-onnx = "python scripts/check_no_committed_onnx.py"
test-no-committed-onnx = "python scripts/check_no_committed_onnx.py --self-test"

# THE REFERENCE FEATURE, FOR `gen_reference/` AND `scripts/convert_*_to_gguf.py`.
#
# These produced the .bin oracles the C++ tests diff against, and the GGUF weights the
# port loads. Every one of them documented itself as `uv run --with torch --with numpy
# --with rfdetr ...`, which names dependencies in a shell line: no lock, no versions, and
# a different resolution on every desk and every day. That is precisely what the `uv` row
# in CLAUDE.md blocklists, and this repository's own manifest header already says so --
# the environment was declared while the instructions telling people how to run these
# scripts still pointed at `uv`.
#
# SEPARATE FROM `gate` RATHER THAN FOLDED INTO IT. `gate` answers one question on every
# change and should stay small; albumentations and its transitive opencv are not something
# the operator gate should install to parse an operator set. The split follows the same
# rule the `coreml` feature records: a feature per job.
#
# `gguf` and `albumentations` were never declared anywhere before this. They were only
# ever `--with` flags, so a desk running `pixi install` got an environment that could not
# run half of these scripts, and found out at ModuleNotFoundError.
[feature.reference.dependencies]
python = "3.11.*"

[feature.reference.pypi-dependencies]
numpy = ">=1.26"
torch = { version = ">=2.6", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cpu" }
rfdetr = "*"
gguf = "*"
pillow = ">=10"
albumentations = "*"

[feature.reference.tasks]
# The oracles. Each writes a .bin that a tests/test_*.cpp reads back and diffs.
reference-backbone = "python gen_reference/gen_reference_backbone.py"
reference-decoder = "python gen_reference/gen_reference_decoder.py"
reference-keypoints = "python gen_reference/gen_reference_keypoints.py"
# The weights the port loads.
convert-dinov2 = "python scripts/convert_dinov2_to_gguf.py"
convert-decoder = "python scripts/convert_decoder_to_gguf.py"
convert-keypoints = "python scripts/convert_keypoints_to_gguf.py"

# THE TRAIN FEATURE, FOR `scripts/finetune_seg.py` AND `scripts/coco_person_subset.py`.
#
# Fine-tuning RFDETRSegNano in PyTorch on the Windows RTX 4090 (plan step 3). The only
# feature with CUDA torch, and the reason it is separate: `reference` and `gate` are CPU on
# purpose and must stay small, and a cu128 wheel set is several gigabytes that change none
# of their answers. win-64 and linux-64 only -- there is no CUDA on osx-arm64.
#
# `rfdetr[train]` pulls pytorch-lightning, torchmetrics, pycocotools, faster-coco-eval, peft
# and scipy. `loggers` is deliberately NOT included; finetune_seg.py turns tensorboard off.
# `gguf` is here so the four convert_*_to_gguf.py scripts can run on the trained .pth
# from the same environment that wrote it.
#
# WHERE IT RUNS. pixi.exe does not work well from a \\wsl.localhost UNC path (no symlinks,
# slow 9P I/O), so the Windows side is a copy of this manifest + lock + scripts under
# C:\Users\ernest.lee\AppData\Local\rfdetr-train, synced from WSL; see finetune_seg.py's
# docstring for the exact commands.
[feature.train]
platforms = ["win-64", "linux-64"]

[feature.train.dependencies]
python = "3.11.*"

[feature.train.pypi-dependencies]
numpy = ">=1.26"
torch = { version = ">=2.7", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cu128" }
rfdetr = { version = ">=1.9.4,<2", extras = ["train"] }
pycocotools = "*"
gguf = "*"
pillow = ">=10"

[feature.train.tasks]
coco-person-subset = "python scripts/coco_person_subset.py"
finetune-seg = "python scripts/finetune_seg.py"

[environments]
gate = { features = ["gate"], no-default-feature = true }
coreml = { features = ["coreml"], no-default-feature = true }
reference = { features = ["reference"], no-default-feature = true }
train = { features = ["train"], no-default-feature = true }

# THE COREML FEATURE, SEPARATE FROM `gate` BECAUSE IT PINS TORCH AND `gate` MUST NOT.
#
# WHY IT EXISTS. `gate_onnx_device.py` measures onnxruntime's `CoreMLExecutionProvider` and
# warns, in its own output, that "CoreML partitions a graph and puts unsupported nodes back
# on the CPU, so a fast row is not proof the accelerator took the whole model". That cuts
# both ways: the SLOW row is not proof either, and `rfd1122-plan.usda` carries
# `neuralEngineUsefulForBackbone = 0` from the slow row. A native conversion can be asked
# WHERE each operation ran, with `MLComputePlan`. RFD 1142 is the measurement.
#
# THE TORCH PIN IS THE WHOLE REASON FOR A SECOND FEATURE. coremltools 9.0 prints "Torch
# version 2.11.0 has not been tested with coremltools ... Torch 2.7.0 is the most recent
# version that has been tested", and under 2.11 the conversion dies inside its own torch
# frontend:
#
#     ops.py:3066 _int -> _cast -> mb.const(val=dtype(x.val))
#     TypeError: only 0-dimensional arrays can be converted to Python scalars
#
# That is a converter fault on an untested pairing, not a statement about the model, and the
# two are worth telling apart before anything is recorded about the device half. Pinning
# torch inside `gate` would move the ONNX gate's own torch for a reason the ONNX gate does
# not have, so this is a second environment rather than a widened first one -- the same
# lesson `anny-render-corpus` records for its restyle and omnigen2 features.
[feature.coreml.dependencies]
python = "3.11.*"

[feature.coreml.pypi-dependencies]
numpy = ">=1.26"
usd-core = "==26.8"
onnx = "*"
onnxruntime = "*"
torch = { version = ">=2.7,<2.8", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cpu" }
rfdetr = "*"
pyarrow = ">=15"
pillow = ">=10"
coremltools = ">=8.0"
